[package]
name = "disfast"
version = "0.1.0"
description = "A fast, lightweight Discord client"
edition = "2021"

[lib]
name = "disfast_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
twilight-gateway = "0.16"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
